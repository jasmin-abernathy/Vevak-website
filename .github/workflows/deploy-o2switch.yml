name: Manual VeVak website deploy to o2switch

# o2switch normally protects SSH/SFTP with an IP allowlist. GitHub-hosted
# runners do not provide a practical fixed source IP for this small project,
# so production deployment is intentionally manual-only until a stable runner
# or another explicitly reviewed deployment mechanism is configured.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vevak-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.O2SWITCH_HOST }}
      DEPLOY_USER: ${{ secrets.O2SWITCH_USER }}
      DEPLOY_PATH: ${{ secrets.O2SWITCH_PATH }}
      DEPLOY_KEY: ${{ secrets.O2SWITCH_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.O2SWITCH_KNOWN_HOSTS }}
      DEPLOY_PORT_SECRET: ${{ secrets.O2SWITCH_PORT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check deployment configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          configured=true
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "Missing configuration for ${name}."
              configured=false
            fi
          done

          echo "configured=$configured" >> "$GITHUB_OUTPUT"

          if [ "$configured" = "false" ]; then
            echo "No deployment attempted. See DEPLOYMENT.md."
            exit 0
          fi

          if [ "$DEPLOY_PATH" = "/" ] || [ ${#DEPLOY_PATH} -lt 5 ]; then
            echo "Refusing to deploy to an unsafe remote path: '$DEPLOY_PATH'"
            exit 1
          fi

      - name: Prepare static site
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy
          cp index.html .deploy/
          cp -R assets .deploy/
          cp -R en .deploy/
          cp robots.txt .deploy/
          cp sitemap.xml .deploy/

          test -f .deploy/index.html
          test -f .deploy/assets/styles.css
          test -f .deploy/en/index.html
          test -f .deploy/robots.txt
          test -f .deploy/sitemap.xml

      - name: Configure SSH
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/vevak_deploy_key"
          chmod 600 "$HOME/.ssh/vevak_deploy_key"

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy to o2switch
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT_SECRET:-22}"

          rsync \
            -az \
            --checksum \
            --exclude='.well-known/' \
            --exclude='.htaccess' \
            -e "ssh -i $HOME/.ssh/vevak_deploy_key -p $PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            .deploy/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Deployment summary
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          echo "VeVak website files were sent to the configured o2switch path."
          echo "Verify https://vevak.lepotager.org manually."

      - name: Setup reminder
        if: steps.config.outputs.configured != 'true'
        shell: bash
        run: |
          echo "No deployment was attempted."
          echo "The recommended first publication is cPanel File Manager; see DEPLOYMENT.md."
