name: Deploy VeVak website to o2switch

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "en/**"
      - "assets/**"
      - "robots.txt"
      - "sitemap.xml"
      - ".github/workflows/deploy-o2switch.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vevak-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.O2SWITCH_HOST }}
      DEPLOY_USER: ${{ secrets.O2SWITCH_USER }}
      DEPLOY_PATH: ${{ secrets.O2SWITCH_PATH }}
      DEPLOY_KEY: ${{ secrets.O2SWITCH_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.O2SWITCH_KNOWN_HOSTS }}
      DEPLOY_PORT_SECRET: ${{ secrets.O2SWITCH_PORT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret for ${name}."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Deployment is not configured yet. See DEPLOYMENT.md."
            exit 1
          fi

          if [ "$DEPLOY_PATH" = "/" ] || [ ${#DEPLOY_PATH} -lt 5 ]; then
            echo "Refusing to deploy to an unsafe remote path: '$DEPLOY_PATH'"
            exit 1
          fi

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy
          cp index.html .deploy/
          cp -R assets .deploy/
          cp -R en .deploy/

          for optional in robots.txt sitemap.xml; do
            if [ -f "$optional" ]; then
              cp "$optional" .deploy/
            fi
          done

          test -f .deploy/index.html
          test -f .deploy/assets/styles.css
          test -f .deploy/en/index.html

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/vevak_deploy_key"
          chmod 600 "$HOME/.ssh/vevak_deploy_key"

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy to o2switch
        shell: bash
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT_SECRET:-22}"

          rsync \
            -az \
            --checksum \
            --exclude='.well-known/' \
            --exclude='.htaccess' \
            -e "ssh -i $HOME/.ssh/vevak_deploy_key -p $PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            .deploy/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Deployment summary
        shell: bash
        run: |
          echo "VeVak website deployed successfully."
          echo "Target: vevak.lepotager.org"
